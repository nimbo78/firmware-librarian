<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400"
     viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">firmware-librarian</title>
  <desc id="d">История Telegram-чата и папка с прошивками как база знаний: на вопрос «как включить WPA3» бот отвечает по опыту чата, ставит ссылку на исходное сообщение и прикладывает файл прошивки AC6805_V200R025C00SPC500.cc.</desc>

  <rect width="1200" height="400" rx="26" fill="#0B0F14"/>

  <g id="title-block">
    <text x="64" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="18" letter-spacing="2.2" fill="#7D8590">RAG ПО ИСТОРИИ ЧАТА · КАТАЛОГ ПРОШИВОК</text>
    <text x="64" y="172" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="58" font-weight="700" fill="#E6EDF3">firmware-librarian</text>
    <text x="64" y="222" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="24" fill="#ADBAC7">История чата и папка с прошивками —</text>
    <text x="64" y="256" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="24" fill="#ADBAC7">как база знаний, которая отвечает и выдаёт файлы</text>
    <line x1="64" y1="296" x2="612" y2="296" stroke="#21262D" stroke-width="1.5"/>
    <text x="64" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="19" fill="#7D8590">185 000 чанков · 327 архивов · поиск 0.6 с</text>
  </g>

  <g id="project-proof" transform="translate(676 48)">
    <rect width="460" height="304" rx="14" fill="#131A22" stroke="#21262D" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="4" fill="#3FB950"/>
    <text x="42" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="17" fill="#7D8590">чат сообщества · топик «Прошивки»</text>

    <rect x="24" y="52" width="412" height="42" rx="12" fill="#1B2430"/>
    <text x="44" y="79" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="20" fill="#58A6FF">/ask как включить WPA3?</text>

    <rect x="24" y="104" width="412" height="108" rx="12" fill="#161D26"/>
    <text x="44" y="133" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="20" fill="#E6EDF3">Включи WPA3-SAE в профиле</text>
    <text x="44" y="161" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="20" fill="#E6EDF3">безопасности; точкам 5700</text>
    <text x="44" y="189" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="20" fill="#E6EDF3">нужен минимум R025 <tspan fill="#58A6FF">[1]</tspan></text>

    <text x="44" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="17" fill="#7D8590">[1] t.me/c/1523091203/48210</text>

    <rect x="24" y="252" width="412" height="42" rx="10" fill="#0F151C" stroke="#30363D" stroke-width="1.5"/>
    <path d="M46 274 l0 -7 a6.5 6.5 0 0 1 13 0 l0 11 a10 10 0 0 1 -20 0 l0 -9"
          fill="none" stroke="#7D8590" stroke-width="2" stroke-linecap="round"/>
    <text x="72" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="17" fill="#ADBAC7">AC6805_V200R025C00SPC500.cc</text>
  </g>
</svg>
