# Имя compose-проекта фиксировано и не зависит от имени папки:
# от него — префикс контейнеров/сетей на NAS
name: firmware-librarian

services:
  librarian:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      CHAT_IDS: ${CHAT_IDS}
      FILE_EXTENSIONS: ${FILE_EXTENSIONS}
      DOWNLOAD_FOLDER: /app/downloads
      TZ: ${TZ:-UTC}
      MTPROXY_HOST: ${MTPROXY_HOST:-}
      MTPROXY_PORT: ${MTPROXY_PORT:-443}
      MTPROXY_SECRET: ${MTPROXY_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KB_CHAT_IDS: ${KB_CHAT_IDS:-}
      KB_DB_PATH: /app/kb/kb.sqlite
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
      EMBED_DIM: ${EMBED_DIM:-512}
      EMBED_API_BASE: ${EMBED_API_BASE:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_PRICE_PER_MTOK: ${EMBED_PRICE_PER_MTOK:-}
      INGEST_HOUR: ${INGEST_HOUR:-5}
      KB_VISION: ${KB_VISION:-0}
      KB_VOICE: ${KB_VOICE:-0}
      KB_PDF: ${KB_PDF:-0}
      KB_HEDEX: ${KB_HEDEX:-0}
      KB_ARCHIVE: ${KB_ARCHIVE:-0}
      KB_BACKUP_DAYS: ${KB_BACKUP_DAYS:-7}
      KB_VISION_MODEL: ${KB_VISION_MODEL:-gpt-5-mini}
      KB_MEDIA_CONCURRENCY: ${KB_MEDIA_CONCURRENCY:-4}
      KB_ADMIN_IDS: ${KB_ADMIN_IDS:-}
      KB_SPACES_FILE: /app/spaces.toml
    volumes:
      - /volume1/public/Repository/Hardware/Huawei/fromChat:/app/downloads
      - /volume1/docker/tg-kb:/app/kb
      # Области знаний. Файл ОБЯЗАН существовать (bind-mount файла падает,
      # если его нет): пустой = одна область из .env, см. spaces.toml.example.
      # redeploy.sh создаёт пустышку сам; вручную — touch spaces.toml.
      # Папка каждой новой области — отдельный том рядом с /app/downloads,
      # путь совпадает с folder в spaces.toml
      - ./spaces.toml:/app/spaces.toml:ro
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kb-bot:

    build: .
    command: ["python", "kb_bot.py"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TZ: ${TZ:-UTC}
      MTPROXY_HOST: ${MTPROXY_HOST:-}
      MTPROXY_PORT: ${MTPROXY_PORT:-443}
      MTPROXY_SECRET: ${MTPROXY_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KB_BOT_TOKEN: ${KB_BOT_TOKEN:-}
      KB_ANSWER_CHAT_IDS: ${KB_ANSWER_CHAT_IDS:-}
      KB_ADMIN_IDS: ${KB_ADMIN_IDS:-}
      INGEST_HOUR: ${INGEST_HOUR:-5}
      KB_GAPS_CHAT_ID: ${KB_GAPS_CHAT_ID:-}
      KB_GAPS_TOPIC_ID: ${KB_GAPS_TOPIC_ID:-}
      KB_DB_PATH: /app/kb/kb.sqlite
      KB_BOT_SESSION: /app/kb/kb_bot
      DOWNLOAD_FOLDER: /app/downloads
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
      EMBED_DIM: ${EMBED_DIM:-512}
      EMBED_API_BASE: ${EMBED_API_BASE:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      ANSWER_MODEL: ${ANSWER_MODEL:-gpt-5-mini}
      KB_WEB: ${KB_WEB:-0}
      KB_CLEANUP_MINUTES: ${KB_CLEANUP_MINUTES:-0}
      KB_SPACES_FILE: /app/spaces.toml
    volumes:
      - /volume1/docker/tg-kb:/app/kb
      # read-only: бот только отдаёт файлы по кнопке 📎 в /fw, пишет — качалка
      - /volume1/public/Repository/Hardware/Huawei/fromChat:/app/downloads:ro
      - ./spaces.toml:/app/spaces.toml:ro
    logging: *default-logging
# Подсеть закреплена, а не отдана на откуп Docker: тот берёт первый свободный
# пул из 172.17–172.31/192.168 и на NAS запросто пересекается с домашней
# сетью или VPN-туннелем — тогда контейнеры теряют доступ наружу, а SSH до
# Synology рвётся на ровном месте. Диапазон вне типовых LAN (192.168.0/1.0,
# 10.0.0.0) и вне дефолтного docker0.
#
# /28 = 14 адресов: два сервиса плюс запас на разовые `docker compose run`
# (бэкфилл, kb_eval, миграции). /24 здесь просто расточительство адресного
# пространства, а /29 (5 адресов) можно исчерпать, забыв убрать контейнер.
#
# ВАЖНО: смена подсети требует пересоздания сети — `docker compose down`
# перед `up`, обычный restart её не тронет.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.25.0/28
